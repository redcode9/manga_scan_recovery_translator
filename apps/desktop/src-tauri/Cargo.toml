[package]
name = "msrt-desktop"
version = "0.0.0"
description = "Manga Scan Recovery Translator — desktop shell"
authors = ["Piero Carrieri"]
license = "MIT"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
